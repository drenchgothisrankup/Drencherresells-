<!DOCTYPE html>

<meta charset="UTF-8">

<title>Drencher Resells</title>
<!-- 🛒 This link loads the styling for your shopping cart popup -->
<link rel="preconnect" href="https://snipcart.com">
<link rel="preconnect" href="https://snipcart.com">
<link rel="stylesheet" href="https://snipcart.com/themes/v3.4.1/default/snipcart.css" />
<style>
body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #0b0b0b; color: #fff; }
header { background-color: #000; color: #fff; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
header h1 { margin: 0; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }

/* 🛒 This is your interactive Shopping Cart Top Button */
.snipcart-checkout { background-color: #fff; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.2s; }
.snipcart-checkout:hover { background-color: #cccccc; }

.container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
.product-card { background: #111; padding: 20px; border: 1px solid #222; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
.product-card img { max-width: 100%; height: 250px; object-fit: cover; margin-bottom: 15px; background: #1a1a1a; }
.price { font-size: 20px; font-weight: bold; color: #aaa; margin-bottom: 10px; }

.size-selector { margin-bottom: 15px; }
.size-selector select { background: #222; color: #fff; border: 1px solid #444; padding: 8px; width: 100%; font-weight: bold; }

/* 🖱️ This is the clickable Add to Cart Button */
.buy-button { background-color: #fff; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s; text-transform: uppercase; width: 100%; }
.buy-button:hover { background-color: #cccccc; }
</style>
</head>

<option value="31">Size 31</option><option value="32">Size 32</option><option value="33">Size 33</option>
